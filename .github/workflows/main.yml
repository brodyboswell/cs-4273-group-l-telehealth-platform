name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run all unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: unit-tests/typescript/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: unit-tests/typescript
        run: npm ci

      - name: Run Python, JavaScript, and TypeScript tests
        run: python -u unit-tests/run_all_tests.py
