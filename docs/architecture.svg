<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 580" width="1300" height="580"
     role="img"
     aria-label="Architecture of the Virtual Client Telehealth Simulation Platform. A student's message travels from the frontend to the backend service, which stores the student response for rubric grading, sends the text plus the current node's allowed edges to an LLM classifier, receives back only an edge identifier and confidence, resolves that edge against the clinician-authored decision tree held inside the backend, and returns the tree's pre-written client reply to the frontend. Rubric scoring reads the session log after the session ends, off the critical path.">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7681"/>
    </marker>
    <marker id="arrowSm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7681"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="580" fill="#f7f8f9"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- ============ title ============ -->
    <text x="30" y="36" font-size="16" font-weight="700" fill="#1f2328">Virtual Client Telehealth Simulation Platform</text>
    <text x="30" y="56" font-size="10.5" fill="#57606a">Request path for one student turn.</text>

    <!-- ============ student ============ -->
    <rect x="30" y="160" width="110" height="90" rx="6" fill="#ffffff" stroke="#a8b0b8" stroke-width="1.2"/>
    <text x="85" y="209" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Student</text>

    <!-- ============ frontend ============ -->
    <rect x="260" y="120" width="200" height="170" rx="6" fill="#ffffff" stroke="#a8b0b8" stroke-width="1.2"/>
    <text x="360" y="168" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Frontend</text>
    <circle cx="272" cy="202" r="2.2" fill="#6b7681"/>
    <text x="282" y="206" font-size="9.2" fill="#1f2328">Chat transcript</text>
    <circle cx="272" cy="226" r="2.2" fill="#6b7681"/>
    <text x="282" y="230" font-size="9.2" fill="#1f2328">Whiteboard</text>
    <circle cx="272" cy="250" r="2.2" fill="#6b7681"/>
    <text x="282" y="254" font-size="9.2" fill="#1f2328">Emotion check-in sheet</text>

    <!-- ============ backend container ============ -->
    <rect x="620" y="84" width="300" height="276" rx="8" fill="#eef1f4" stroke="#6b7681" stroke-width="1.4"/>
    <text x="770" y="110" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Backend Service</text>

    <rect x="636" y="126" width="268" height="40" rx="5" fill="#ffffff" stroke="#a8b0b8" stroke-width="1.2"/>
    <text x="770" y="150" font-size="10.5" font-weight="600" fill="#1f2328" text-anchor="middle">Input validation &amp; normalize</text>

    <rect x="636" y="186" width="268" height="40" rx="5" fill="#ffffff" stroke="#a8b0b8" stroke-width="1.2"/>
    <text x="770" y="204" font-size="10.5" font-weight="600" fill="#1f2328" text-anchor="middle">Session FSM</text>
    <text x="770" y="218" font-size="8.5" fill="#57606a" text-anchor="middle">current node · allowed edges</text>

    <rect x="636" y="246" width="268" height="88" rx="5" fill="#ffffff" stroke="#1f6feb" stroke-width="1.7"/>
    <circle cx="652" cy="272" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
    <text x="652" y="275.5" font-size="10" font-weight="600" fill="#1f2328" text-anchor="middle">6</text>
    <text x="668" y="276" font-size="10.5" font-weight="600" fill="#1f6feb">Decision Tree</text>
    <text x="668" y="294" font-size="8.5" fill="#57606a">clinician-authored</text>
    <text x="668" y="307" font-size="8.5" fill="#57606a">nodes + allowed edges</text>
    <line x1="846" y1="275" x2="820" y2="301" stroke="#8c959f" stroke-width="1.2"/>
    <line x1="846" y1="275" x2="872" y2="301" stroke="#1f6feb" stroke-width="2"/>
    <circle cx="846" cy="270" r="5" fill="#1f2328"/>
    <circle cx="820" cy="306" r="5" fill="#ffffff" stroke="#8c959f" stroke-width="1.4"/>
    <circle cx="872" cy="306" r="5" fill="#1f6feb"/>

    <!-- internal pipeline arrows -->
    <line x1="770" y1="166" x2="770" y2="186" stroke="#6b7681" stroke-width="1.2" marker-end="url(#arrowSm)"/>
    <line x1="770" y1="226" x2="770" y2="246" stroke="#6b7681" stroke-width="1.2" marker-end="url(#arrowSm)"/>

    <!-- ============ llm ============ -->
    <rect x="1080" y="150" width="190" height="140" rx="6" fill="#ffffff" stroke="#a8b0b8" stroke-width="1.2"/>
    <text x="1175" y="192" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">LLM Classifier API</text>
    <text x="1175" y="214" font-size="8.8" fill="#57606a" text-anchor="middle">constrained structured output</text>
    <text x="1175" y="228" font-size="8.8" fill="#57606a" text-anchor="middle">(returns one of a closed edge set)</text>
    <text x="1175" y="252" font-size="9" font-weight="600" fill="#1f6feb" text-anchor="middle">picks an edge —</text>
    <text x="1175" y="265" font-size="9" font-weight="600" fill="#1f6feb" text-anchor="middle">never writes dialogue</text>

    <!-- ============ session log ============ -->
    <rect x="620" y="444" width="300" height="84" rx="6" fill="#ffffff" stroke="#a8b0b8" stroke-width="1.2"/>
    <text x="770" y="472" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Session Log &amp; Metric Store</text>
    <text x="770" y="490" font-size="8.8" fill="#57606a" text-anchor="middle">every student response, in order</text>
    <text x="770" y="505" font-size="8.8" fill="#57606a" text-anchor="middle">held for rubric grading later</text>

    <!-- ============ rubric ============ -->
    <rect x="1020" y="444" width="250" height="84" rx="6" fill="#ffffff" stroke="#a8b0b8" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="1145" y="472" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Rubric Scoring</text>
    <text x="1145" y="490" font-size="8.8" fill="#57606a" text-anchor="middle">A/B/C benchmarks · decision points</text>
    <text x="1145" y="505" font-size="8.8" fill="#57606a" text-anchor="middle">safety-cue review · feedback</text>

    <!-- ============ 1. student -> frontend ============ -->
    <line x1="140" y1="190" x2="260" y2="190" stroke="#1f2328" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="200" y="166" font-size="9.2" fill="#1f2328" text-anchor="middle">types message</text>
    <text x="200" y="178" font-size="9.2" fill="#1f2328" text-anchor="middle">or uses tool</text>
    <circle cx="200" cy="190" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
    <text x="200" y="193.5" font-size="10" font-weight="600" fill="#1f2328" text-anchor="middle">1</text>

    <!-- ============ 8. frontend -> student ============ -->
    <line x1="260" y1="245" x2="140" y2="245" stroke="#1f2328" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="200" y="266" font-size="9.2" fill="#1f2328" text-anchor="middle">renders client reply</text>
    <circle cx="200" cy="245" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
    <text x="200" y="248.5" font-size="10" font-weight="600" fill="#1f2328" text-anchor="middle">8</text>

    <!-- ============ 2. frontend -> backend ============ -->
    <line x1="460" y1="145" x2="620" y2="145" stroke="#1f2328" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="540" y="121" font-size="9.2" fill="#1f2328" text-anchor="middle">POST /session/turn</text>
    <text x="540" y="133" font-size="8.6" fill="#57606a" text-anchor="middle">{ sessionId, nodeId, rawText }</text>
    <circle cx="540" cy="145" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
    <text x="540" y="148.5" font-size="10" font-weight="600" fill="#1f2328" text-anchor="middle">2</text>

    <!-- ============ 7. backend -> frontend ============ -->
    <line x1="620" y1="270" x2="460" y2="270" stroke="#1f2328" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="540" y="291" font-size="9.2" fill="#1f2328" text-anchor="middle">authored client text</text>
    <text x="540" y="303" font-size="8.6" fill="#57606a" text-anchor="middle">{ clientText, nodeId, toolDirective? }</text>
    <circle cx="540" cy="270" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
    <text x="540" y="273.5" font-size="10" font-weight="600" fill="#1f2328" text-anchor="middle">7</text>

    <!-- ============ 4. backend -> llm ============ -->
    <line x1="920" y1="175" x2="1080" y2="175" stroke="#1f2328" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="1000" y="151" font-size="9.2" fill="#1f2328" text-anchor="middle">rawText + allowed edges</text>
    <text x="1000" y="163" font-size="8.6" fill="#57606a" text-anchor="middle">of the current node only</text>
    <circle cx="1000" cy="175" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
    <text x="1000" y="178.5" font-size="10" font-weight="600" fill="#1f2328" text-anchor="middle">4</text>

    <!-- ============ 5. llm -> backend (the load-bearing edge) ============ -->
    <line x1="1080" y1="265" x2="920" y2="265" stroke="#1f6feb" stroke-width="2.2" marker-end="url(#arrowAccent)"/>
    <text x="1000" y="287" font-size="9.2" font-weight="600" fill="#1f6feb" text-anchor="middle">{ edgeId, confidence }</text>
    <text x="1000" y="299" font-size="8.6" fill="#1f6feb" text-anchor="middle">an identifier, not prose</text>
    <circle cx="1000" cy="265" r="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.4"/>
    <text x="1000" y="268.5" font-size="10" font-weight="600" fill="#1f6feb" text-anchor="middle">5</text>

    <!-- ============ 3. backend -> log ============ -->
    <line x1="680" y1="360" x2="680" y2="444" stroke="#1f2328" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="696" y="396" font-size="9.2" fill="#1f2328">store student response</text>
    <text x="696" y="409" font-size="8.6" fill="#57606a">(verbatim, for grading)</text>
    <circle cx="680" cy="402" r="9" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
    <text x="680" y="405.5" font-size="10" font-weight="600" fill="#1f2328" text-anchor="middle">3</text>

    <!-- ==== completing the same turn record, once the edge resolves ==== -->
    <line x1="860" y1="360" x2="860" y2="444" stroke="#6b7681" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
    <text x="876" y="396" font-size="8.8" fill="#57606a">on resolve: which node</text>
    <text x="876" y="409" font-size="8.8" fill="#57606a">the response led to</text>

    <!-- ============ log -> rubric (off critical path) ============ -->
    <line x1="920" y1="486" x2="1020" y2="486" stroke="#6b7681" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
    <text x="970" y="472" font-size="8.8" fill="#57606a" text-anchor="middle">post-session</text>
    <text x="970" y="504" font-size="8.8" fill="#57606a" text-anchor="middle">off critical path</text>

    <!-- ============ footnote ============ -->
    <text x="30" y="558" font-size="9.5" fill="#57606a">Steps 1–8 are one student turn. The LLM never authors clinical dialogue — it selects one edge from the current node's pre-approved set, and the tree supplies the words.</text>

  </g>
</svg>
